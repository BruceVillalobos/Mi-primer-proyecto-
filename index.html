<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Primer proyecto - Bruce</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    height: 100vh;
    background: linear-gradient(to bottom, #000000 0%, #1a1a1a 45%, #2b2b2b 100%);
    overflow: hidden;
    position: relative;
    font-family: 'Georgia', serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* Luna */
  .luna {
    position: absolute;
    top: 60px;
    right: 100px;
    width: 90px;
    height: 90px;
    background: #f5f5f5;
    border-radius: 50%;
    box-shadow: 0 0 60px #ffffff, 0 0 120px rgba(255,255,255,0.35);
  }

  /* Torii */
  .torii {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 320px;
    opacity: 0.9;
  }
  .torii svg { width: 100%; filter: drop-shadow(0 0 15px rgba(255,255,255,0.25)); }

  /* Petalos */
  .petalo {
    position: absolute;
    top: -20px;
    color: #e8e8e8;
    animation: caer linear infinite;
    user-select: none;
    opacity: 0.85;
  }

  @keyframes caer {
    0%   { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0.9; }
    100% { transform: translateY(110vh) translateX(60px) rotate(360deg); opacity: 0.2; }
  }

  /* Textos */
  .contenedor-texto {
    z-index: 5;
    text-align: center;
    margin-bottom: 40px;
  }

  .japones {
    font-size: 34px;
    color: #ffffff;
    letter-spacing: 6px;
    white-space: nowrap;
    overflow: hidden;
    border-right: 2px solid #ffffff;
    width: 0;
    margin: 0 auto;
    animation: escribir1 2s steps(12) forwards, parpadeo 0.7s step-end infinite;
    text-shadow: 0 0 10px rgba(255,255,255,0.5);
  }

  .subtitulo {
    margin-top: 18px;
    font-size: 16px;
    letter-spacing: 3px;
    color: #b0b0b0;
    opacity: 0;
    animation: aparecer 1.5s ease forwards;
    animation-delay: 2.3s;
  }

  .nombre {
    margin-top: 30px;
    font-size: 22px;
    letter-spacing: 8px;
    color: #ffffff;
    text-transform: uppercase;
    opacity: 0;
    animation: aparecer 1.5s ease forwards;
    animation-delay: 3s;
    text-shadow: 0 0 15px rgba(255,255,255,0.6);
  }

  .nombre span {
    color: #999999;
    border-bottom: 1px solid #999999;
  }

  @keyframes escribir1 {
    from { width: 0; }
    to { width: 12ch; }
  }

  @keyframes parpadeo {
    50% { border-color: transparent; }
  }

  @keyframes aparecer {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

  <div class="luna"></div>

  <div class="contenedor-texto">
    <div class="japones">私の最初のプロジェクト</div>
    <div class="subtitulo">MI PRIMER PROYECTO</div>
    <div class="nombre">creado por <span>Bruce</span></div>
  </div>

  <div class="torii">
    <svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
      <rect x="20" y="40" width="260" height="16" fill="#e5e5e5"/>
      <rect x="10" y="65" width="280" height="10" fill="#cfcfcf"/>
      <rect x="55" y="55" width="18" height="140" fill="#e5e5e5"/>
      <rect x="227" y="55" width="18" height="140" fill="#e5e5e5"/>
      <rect x="130" y="75" width="40" height="10" fill="#cfcfcf"/>
    </svg>
  </div>

  <script>
    const simbolos = ["❋","✦","❈","❉"];
    const total = 25;
    for (let i = 0; i < total; i++) {
      const p = document.createElement("div");
      p.className = "petalo";
      p.textContent = simbolos[Math.floor(Math.random() * simbolos.length)];
      p.style.left = Math.random() * 100 + "vw";
      p.style.animationDuration = (6 + Math.random() * 6) + "s";
      p.style.animationDelay = (Math.random() * 8) + "s";
      p.style.fontSize = (14 + Math.random() * 14) + "px";
      document.body.appendChild(p);
    }
  </script>

</body>
</html>
